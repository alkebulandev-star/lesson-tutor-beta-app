<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LT Command Centre</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050a14;--card:#0a1020;--card2:#0d1528;--border:rgba(56,189,248,.12);
  --accent:#38bdf8;--accent2:#818cf8;--accent3:#34d399;--accent4:#f472b6;--accent5:#fb923c;
  --text:#e2e8f0;--dim:rgba(255,255,255,.4);--glow:0 0 30px rgba(56,189,248,.15);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 50% at 50% -20%,rgba(56,189,248,.08),transparent),
  radial-gradient(ellipse 60% 40% at 80% 100%,rgba(129,140,248,.06),transparent),
  radial-gradient(ellipse 50% 30% at 10% 60%,rgba(52,211,153,.04),transparent);
  pointer-events:none;z-index:0}
body::after{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(56,189,248,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.03) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;z-index:0}

/* ═══ LOGIN ═══ */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;z-index:1}
.login-card{background:rgba(10,16,32,.9);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:40px;max-width:440px;width:100%;box-shadow:var(--glow)}
.login-card .logo{font-size:2.4rem;margin-bottom:4px}
.login-card h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.login-card .sub{color:var(--dim);font-size:.8rem;margin-bottom:24px}
.login-card input{width:100%;padding:14px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;border-radius:10px;font-size:.88rem;font-family:inherit;margin-bottom:12px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--accent)}
.login-card button{width:100%;padding:14px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer;font-size:.92rem;font-family:inherit;transition:transform .15s,box-shadow .15s}
.login-card button:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(37,99,235,.4)}
.login-card button:disabled{opacity:.5;cursor:default;transform:none}
.login-err{color:#f87171;font-size:.8rem;margin-bottom:12px;padding:10px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:8px;display:none}
.login-info{color:var(--accent);font-size:.78rem;margin-top:16px;padding:12px;background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.15);border-radius:8px;line-height:1.5}

/* ═══ DASH SHELL ═══ */
.dash{display:none;position:relative;z-index:1}
.dash.active{display:block}
.topbar{padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04);backdrop-filter:blur(12px);position:sticky;top:0;z-index:100;background:rgba(5,10,20,.8)}
.topbar .brand{display:flex;align-items:center;gap:12px}
.topbar .brand span{font-size:1.4rem}
.topbar h1{font-size:1.1rem;font-weight:800;letter-spacing:-.01em}
.topbar .tag{font-size:.6rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;padding:2px 8px;border-radius:100px;margin-left:8px;text-transform:uppercase;letter-spacing:.05em}
.topbar-r{display:flex;align-items:center;gap:10px}
.topbar-r .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent3);box-shadow:0 0 12px var(--accent3);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.topbar-r .status{font-size:.75rem;color:var(--accent3);font-weight:600}
.topbar-r .admin-name{font-size:.78rem;color:var(--accent2);font-weight:600}
.tb-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.78rem;font-weight:600;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:6px}
.tb-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}
.tb-btn.danger{color:#fca5a5;border-color:rgba(248,113,113,.25)}
.tb-btn.danger:hover{background:rgba(248,113,113,.1)}
.content{padding:24px 28px;max-width:1500px;margin:0 auto}

/* ═══ STAT CARDS ═══ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.stats{grid-template-columns:1fr}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat:nth-child(1)::before{background:linear-gradient(90deg,var(--accent),transparent)}
.stat:nth-child(2)::before{background:linear-gradient(90deg,var(--accent2),transparent)}
.stat:nth-child(3)::before{background:linear-gradient(90deg,var(--accent3),transparent)}
.stat:nth-child(4)::before{background:linear-gradient(90deg,var(--accent4),transparent)}
.stat:nth-child(5)::before{background:linear-gradient(90deg,var(--accent5),transparent)}
.stat:nth-child(6)::before{background:linear-gradient(90deg,#a78bfa,transparent)}
.stat:nth-child(7)::before{background:linear-gradient(90deg,#fbbf24,transparent)}
.stat:nth-child(8)::before{background:linear-gradient(90deg,#22d3ee,transparent)}
.stat .s-icon{font-size:1.6rem;margin-bottom:8px}
.stat .s-num{font-size:2.2rem;font-weight:900;letter-spacing:-.03em;line-height:1}
.stat:nth-child(1) .s-num{color:var(--accent)}
.stat:nth-child(2) .s-num{color:var(--accent2)}
.stat:nth-child(3) .s-num{color:var(--accent3)}
.stat:nth-child(4) .s-num{color:var(--accent4)}
.stat:nth-child(5) .s-num{color:var(--accent5)}
.stat:nth-child(6) .s-num{color:#a78bfa}
.stat:nth-child(7) .s-num{color:#fbbf24}
.stat:nth-child(8) .s-num{color:#22d3ee}
.stat .s-lbl{font-size:.7rem;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
.stat .s-bar{height:3px;border-radius:3px;margin-top:10px;background:rgba(255,255,255,.04);overflow:hidden}
.stat .s-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
.stat:nth-child(1) .s-bar-fill{background:var(--accent)}
.stat:nth-child(2) .s-bar-fill{background:var(--accent2)}
.stat:nth-child(3) .s-bar-fill{background:var(--accent3)}
.stat:nth-child(4) .s-bar-fill{background:var(--accent4)}
.stat:nth-child(5) .s-bar-fill{background:var(--accent5)}
.stat:nth-child(6) .s-bar-fill{background:#a78bfa}
.stat:nth-child(7) .s-bar-fill{background:#fbbf24}
.stat:nth-child(8) .s-bar-fill{background:#22d3ee}

/* ═══ TABS ═══ */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;overflow-x:auto}
.tab{padding:10px 20px;background:transparent;border:none;color:var(--dim);font-weight:700;font-size:.82rem;cursor:pointer;border-radius:8px;font-family:inherit;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.tab.on{background:rgba(56,189,248,.1);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(56,189,248,.2)}

/* ═══ TABLES ═══ */
.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.panel-hd{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.04);flex-wrap:wrap;gap:10px}
.panel-hd h2{font-size:.95rem;font-weight:800}
.search{padding:10px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;border-radius:8px;font-size:.82rem;width:260px;font-family:inherit;outline:none;transition:border .2s}
.search:focus{border-color:var(--accent)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;padding:10px 16px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.68rem;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap;background:rgba(255,255,255,.01)}
td{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,.03);white-space:nowrap}
tr{transition:background .1s}
tr:hover td{background:rgba(56,189,248,.03)}
tr.clickable{cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:.68rem;font-weight:700;letter-spacing:.02em}
.badge-student{background:rgba(56,189,248,.12);color:var(--accent)}
.badge-parent{background:rgba(129,140,248,.12);color:var(--accent2)}
.badge-admin{background:rgba(251,191,36,.12);color:#fbbf24}
.badge-live{background:rgba(52,211,153,.12);color:var(--accent3)}
.badge-open{background:rgba(56,189,248,.12);color:var(--accent)}
.badge-ended{background:rgba(255,255,255,.06);color:var(--dim)}

/* ═══ DETAIL SLIDE ═══ */
.detail-bd{position:fixed;inset:0;background:rgba(5,10,20,.7);backdrop-filter:blur(8px);z-index:200;display:none;align-items:flex-start;justify-content:flex-end}
.detail-bd.open{display:flex}
.detail-panel{width:520px;max-width:92vw;height:100vh;background:var(--card);border-left:1px solid var(--border);padding:0;overflow-y:auto;animation:slideIn .25s ease}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.dp-hd{padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.dp-hd h2{font-size:1.1rem;font-weight:800}
.dp-close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.dp-body{padding:24px}
.dp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.dp-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);border-radius:10px;padding:14px}
.dp-item .dk{font-size:.65rem;color:var(--dim);text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-bottom:4px}
.dp-item .dv{font-size:1.05rem;font-weight:700;color:#fff;word-break:break-all}
.dp-section{font-size:.85rem;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px}
.mini-tbl{width:100%;border-collapse:collapse;font-size:.78rem;margin-bottom:16px}
.mini-tbl th{padding:8px 10px;background:rgba(255,255,255,.02);text-align:left;font-size:.66rem;color:var(--dim);font-weight:700;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.04)}
.mini-tbl td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.02)}

/* ═══ CHARTS ═══ */
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chart-label{width:80px;font-size:.72rem;color:var(--dim);text-align:right;flex-shrink:0}
.chart-bar{flex:1;height:22px;background:rgba(255,255,255,.03);border-radius:6px;overflow:hidden}
.chart-fill{height:100%;border-radius:6px;transition:width .6s ease;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:.68rem;font-weight:700;color:#fff;min-width:fit-content}
.chart-fill.c1{background:linear-gradient(90deg,rgba(56,189,248,.3),rgba(56,189,248,.7))}
.chart-fill.c2{background:linear-gradient(90deg,rgba(129,140,248,.3),rgba(129,140,248,.7))}
.chart-fill.c3{background:linear-gradient(90deg,rgba(52,211,153,.3),rgba(52,211,153,.7))}
.chart-fill.c4{background:linear-gradient(90deg,rgba(244,114,182,.3),rgba(244,114,182,.7))}
.chart-fill.c5{background:linear-gradient(90deg,rgba(251,191,36,.3),rgba(251,191,36,.7))}

/* ═══ ACTIVITY FEED ═══ */
.feed{list-style:none;padding:0}
.feed li{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03);display:flex;align-items:center;gap:12px;font-size:.82rem}
.feed .f-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.feed .f-time{color:var(--dim);font-size:.72rem;margin-left:auto;white-space:nowrap;font-family:'JetBrains Mono',monospace}

.empty{text-align:center;padding:50px 20px;color:var(--dim)}
.empty .e-icon{font-size:2.5rem;margin-bottom:8px;opacity:.5}
.loading{text-align:center;padding:50px;color:var(--dim);font-size:.85rem}
.loading::after{content:'';display:inline-block;width:16px;height:16px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin-left:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:768px){
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .stats{grid-template-columns:1fr 1fr}
  .stat .s-num{font-size:1.6rem}
}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <div class="logo">&#128752;</div>
    <h1>COMMAND CENTRE</h1>
    <div class="sub">Lesson Teacher Admin &middot; Sign in with your admin account</div>
    <div class="login-err" id="loginErr"></div>
    <input type="email" id="emailInput" placeholder="Admin email" autocomplete="email" />
    <input type="password" id="passInput" placeholder="Password" autocomplete="current-password" />
    <button id="loginBtn" onclick="doLogin()">Authenticate</button>
  </div>
</div>

<!-- ═══ DASHBOARD ═══ -->
<div class="dash" id="dashboard">
  <div class="topbar">
    <div class="brand">
      <span>&#128752;</span>
      <div><h1>LT Command Centre<span class="tag">Live</span></h1></div>
    </div>
    <div class="topbar-r">
      <div class="pulse"></div>
      <span class="status" id="statusText">Connected</span>
      <span class="admin-name" id="adminName"></span>
      <button class="tb-btn" onclick="loadAll()">&#8635; Refresh</button>
      <button class="tb-btn danger" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="content">
    <div class="stats" id="statsArea"></div>
    <div class="tabs" id="tabBar">
      <button class="tab on" data-tab="overview" onclick="switchTab('overview')">&#9670; Overview</button>
      <button class="tab" data-tab="users" onclick="switchTab('users')">&#128100; Users</button>
      <button class="tab" data-tab="progress" onclick="switchTab('progress')">&#128200; Progress</button>
      <button class="tab" data-tab="parents" onclick="switchTab('parents')">&#128106; Parents</button>
      <button class="tab" data-tab="arena" onclick="switchTab('arena')">&#127942; Arena</button>
      <button class="tab" data-tab="social" onclick="switchTab('social')">&#128172; Social</button>
    </div>
    <div id="tabContent"></div>
  </div>
</div>

<!-- ═══ DETAIL SLIDE PANEL ═══ -->
<div class="detail-bd" id="detailBd" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detailPanel"></div>
</div>

<script type="module">
/* ════════════════════════════════════════════════════════
   LT COMMAND CENTRE
   Uses Supabase anon key + admin auth (no service_role key)
   Admin reads all data via RLS policies for role='admin'
   ════════════════════════════════════════════════════════ */
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL  = 'https://gnibxryiuazuwmmworlq.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImduaWJ4cnlpdWF6dXdtbXdvcmxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NzczNzEsImV4cCI6MjA5NDE1MzM3MX0.Xu7vyIxcHudhEJ79nOfyXc3hrs02lM_H1y_K5qJNCEw';

const sb = createClient(SB_URL, SB_ANON);
let allData = {};
let currentTab = 'overview';
let adminProfile = null;

// ── LOGIN ──
window.doLogin = async function(){
  const email = document.getElementById('emailInput').value.trim();
  const pass  = document.getElementById('passInput').value;
  const err   = document.getElementById('loginErr');
  const btn   = document.getElementById('loginBtn');
  err.style.display = 'none';

  if (!email || !pass){
    err.textContent = 'Enter your email and password.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true; btn.textContent = 'Authenticating...';

  try {
    const { data: authData, error: authErr } = await sb.auth.signInWithPassword({ email, password: pass });
    if (authErr) throw authErr;

    // Check if this user has admin role
    const { data: profile, error: profErr } = await sb.from('profiles').select('*').eq('id', authData.user.id).single();
    if (profErr) throw profErr;

    if (profile.role !== 'admin'){
      err.innerHTML = 'Access denied. Your role is <strong>' + esc(profile.role) + '</strong>, not <strong>admin</strong>.<br><br>To grant yourself admin access, run this in the <a href="https://supabase.com/dashboard" target="_blank" style="color:var(--accent)">Supabase SQL Editor</a>:<br><code style="display:block;margin-top:8px;padding:8px;background:rgba(0,0,0,.3);border-radius:6px;font-size:.75rem;word-break:break-all">UPDATE profiles SET role = \'admin\' WHERE email = \'' + esc(email) + '\';</code>';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Authenticate';
      await sb.auth.signOut();
      return;
    }

    adminProfile = profile;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    document.getElementById('adminName').textContent = profile.name || email;
    loadAll();
  } catch(e){
    err.textContent = 'Login failed: ' + (e.message || e);
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Authenticate';
  }
};

window.doLogout = async function(){
  await sb.auth.signOut();
  location.reload();
};

// Auto-login from existing session
(async function(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){
    try {
      const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
      if (profile && profile.role === 'admin'){
        adminProfile = profile;
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
        document.getElementById('adminName').textContent = profile.name || session.user.email;
        loadAll();
      }
    } catch(e){}
  }
})();

// Enter key to login
document.getElementById('passInput').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

// ── LOAD ALL DATA ──
window.loadAll = async function(){
  document.getElementById('statusText').textContent = 'Syncing...';
  document.getElementById('tabContent').innerHTML = '<div class="loading">Loading telemetry</div>';

  try {
    const [profiles, progress, parents, arenaProf, leaders, rooms, social, links, threads] = await Promise.all([
      sb.from('profiles').select('*').order('created_at', { ascending: false }),
      sb.from('user_progress').select('*'),
      sb.from('parent_state').select('*'),
      sb.from('arena_profiles').select('*'),
      sb.from('arena_leaders').select('*').order('xp', { ascending: false }).limit(100),
      sb.from('arena_rooms').select('*').order('created_at', { ascending: false }).limit(50),
      sb.from('social_profiles').select('*'),
      sb.from('parent_links').select('*'),
      sb.from('dm_threads').select('*').order('last_at', { ascending: false }).limit(50),
    ]);

    allData = {
      profiles: profiles.data || [],
      progress: progress.data || [],
      parents: parents.data || [],
      arenaProfiles: arenaProf.data || [],
      leaders: leaders.data || [],
      rooms: rooms.data || [],
      social: social.data || [],
      links: links.data || [],
      threads: threads.data || [],
    };

    renderStats();
    switchTab(currentTab);
    document.getElementById('statusText').textContent = 'Connected';
  } catch(e){
    document.getElementById('tabContent').innerHTML = '<div class="empty"><div class="e-icon">&#9888;</div>Failed to load: ' + esc(e.message || e) + '</div>';
    document.getElementById('statusText').textContent = 'Error';
  }
};

// ── STATS ──
function renderStats(){
  const p = allData.profiles || [];
  const students = p.filter(u => u.role === 'student');
  const parentsList = p.filter(u => u.role === 'parent');
  const prog = allData.progress || [];
  let totalXP = 0, totalTopics = 0, totalQuizzes = 0;
  prog.forEach(r => { const d = r.data || {}; totalXP += d.xp || 0; totalTopics += d.topicsCompleted || 0; totalQuizzes += (d.quizResults || []).length; });
  const liveRooms = (allData.rooms || []).filter(r => r.status === 'open' || r.status === 'live').length;
  const linkedKids = (allData.links || []).length;
  const maxVal = Math.max(p.length, totalTopics, totalXP, 1);

  document.getElementById('statsArea').innerHTML =
    statCard('&#128101;', p.length, 'Total Users', p.length, maxVal) +
    statCard('&#127891;', students.length, 'Students', students.length, maxVal) +
    statCard('&#128106;', parentsList.length, 'Parents', parentsList.length, maxVal) +
    statCard('&#128218;', totalTopics, 'Lessons Done', totalTopics, maxVal) +
    statCard('&#10004;', totalQuizzes, 'Quizzes Taken', totalQuizzes, maxVal) +
    statCard('&#9889;', totalXP.toLocaleString(), 'Total XP', totalXP, maxVal) +
    statCard('&#128279;', linkedKids, 'Parent Links', linkedKids, maxVal) +
    statCard('&#127919;', liveRooms, 'Live Rooms', liveRooms, Math.max(liveRooms, 10));
}
function statCard(icon, num, label, val, max){
  const pct = max > 0 ? Math.min(100, Math.round((val / max) * 100)) : 0;
  return '<div class="stat"><div class="s-icon">' + icon + '</div><div class="s-num">' + num + '</div><div class="s-lbl">' + label + '</div><div class="s-bar"><div class="s-bar-fill" style="width:' + pct + '%"></div></div></div>';
}

// ── TABS ──
window.switchTab = function(tab){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  const c = document.getElementById('tabContent');
  if (tab === 'overview') renderOverview(c);
  else if (tab === 'users') renderUsers(c);
  else if (tab === 'progress') renderProgress(c);
  else if (tab === 'parents') renderParents(c);
  else if (tab === 'arena') renderArena(c);
  else if (tab === 'social') renderSocial(c);
};

// ══════════════════ OVERVIEW ══════════════════
function renderOverview(c){
  const p = allData.profiles || [];
  const prog = allData.progress || [];

  const classCounts = {};
  p.forEach(u => { if (u.role === 'student' && u.class_level) classCounts[u.class_level] = (classCounts[u.class_level] || 0) + 1; });
  const classEntries = Object.entries(classCounts).sort((a,b) => b[1] - a[1]).slice(0, 8);
  const maxClass = classEntries.length ? classEntries[0][1] : 1;

  const sectionCounts = { kids: 0, primary: 0, jss: 0, sss: 0 };
  p.forEach(u => { if (u.section && sectionCounts[u.section] !== undefined) sectionCounts[u.section]++; });
  const sectionEntries = Object.entries(sectionCounts);
  const maxSection = Math.max(...Object.values(sectionCounts), 1);

  const topStudents = prog.map(r => {
    const d = r.data || {};
    const u = p.find(x => x.id === r.user_id) || {};
    return { name: u.name || 'Unknown', xp: d.xp || 0, topics: d.topicsCompleted || 0, cls: u.class_level || '' };
  }).sort((a,b) => b.xp - a.xp).slice(0, 5);
  const maxXP = topStudents.length ? topStudents[0].xp || 1 : 1;

  const recent = p.slice(0, 8);

  let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">';

  html += '<div class="panel"><div class="panel-hd"><h2>&#128202; Class Distribution</h2></div><div style="padding:16px 20px">';
  if (!classEntries.length) html += '<div class="empty"><div class="e-icon">&#128203;</div>No data yet</div>';
  else classEntries.forEach((e, i) => {
    html += '<div class="chart-row"><div class="chart-label">' + esc(e[0]) + '</div><div class="chart-bar"><div class="chart-fill c' + ((i%5)+1) + '" style="width:' + Math.round((e[1]/maxClass)*100) + '%">' + e[1] + '</div></div></div>';
  });
  html += '</div></div>';

  html += '<div class="panel"><div class="panel-hd"><h2>&#127979; Section Breakdown</h2></div><div style="padding:16px 20px">';
  var sLbl = { kids:'Kids Zone', primary:'Primary', jss:'Junior Sec', sss:'Senior Sec' };
  sectionEntries.forEach((e, i) => {
    html += '<div class="chart-row"><div class="chart-label">' + (sLbl[e[0]]||e[0]) + '</div><div class="chart-bar"><div class="chart-fill c' + ((i%5)+1) + '" style="width:' + Math.max(Math.round((e[1]/maxSection)*100),2) + '%">' + e[1] + '</div></div></div>';
  });
  html += '</div></div></div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';

  html += '<div class="panel"><div class="panel-hd"><h2>&#127942; Top Performers</h2></div>';
  if (!topStudents.length) html += '<div class="empty"><div class="e-icon">&#128640;</div>No progress yet</div>';
  else {
    html += '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Student</th><th>Class</th><th>XP</th><th>Topics</th></tr></thead><tbody>';
    topStudents.forEach((s, i) => {
      const medal = i === 0 ? '&#129351;' : i === 1 ? '&#129352;' : i === 2 ? '&#129353;' : '';
      html += '<tr><td style="font-weight:800">' + (medal || (i+1)) + '</td><td><strong>' + esc(s.name) + '</strong></td><td>' + esc(s.cls) + '</td><td style="font-weight:800;color:var(--accent5)">' + s.xp.toLocaleString() + '</td><td>' + s.topics + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  html += '<div class="panel"><div class="panel-hd"><h2>&#128226; Recent Signups</h2></div>';
  if (!recent.length) html += '<div class="empty"><div class="e-icon">&#128100;</div>No users yet</div>';
  else {
    html += '<ul class="feed">';
    recent.forEach(u => {
      const dotColor = u.role === 'parent' ? 'background:var(--accent2)' : 'background:var(--accent)';
      html += '<li><span class="f-dot" style="' + dotColor + '"></span><strong>' + esc(u.name || 'Unknown') + '</strong>&nbsp;<span class="badge badge-' + (u.role || 'student') + '">' + (u.role || 'student') + '</span>&nbsp;' + esc(u.class_level || '') + '<span class="f-time">' + timeAgo(u.created_at) + '</span></li>';
    });
    html += '</ul>';
  }
  html += '</div></div>';

  c.innerHTML = html;
}

// ══════════════════ USERS ══════════════════

// ══════════════════ USER DETAIL ══════════════════
window.showUserDetail = function(uid){
  const u = (allData.profiles||[]).find(p => p.id === uid); if (!u) return;
  const prog = (allData.progress||[]).find(p => p.user_id === uid);
  const soc = (allData.social||[]).find(s => s.user_id === uid);
  const arena = (allData.arenaProfiles||[]).find(a => a.user_id === uid);
  const d = prog ? prog.data || {} : {};

  let html = '<div class="dp-hd"><h2>' + esc(u.name||'User') + '</h2><button class="dp-close" onclick="closeDetail()">&times;</button></div><div class="dp-body">';
  html += '<div class="dp-grid">';
  html += dpItem('Email', u.email||'-') + dpItem('Role', u.role||'student') + dpItem('Section', u.section||'-') + dpItem('Class', u.class_level||'-');
  html += dpItem('Stream', u.stream||'-') + dpItem('School', u.school||'-') + dpItem('State', u.state||'-') + dpItem('Joined', u.created_at ? new Date(u.created_at).toLocaleDateString() : '-');
  html += '</div>';

  html += '<div class="dp-section">&#9889; Learning Progress</div><div class="dp-grid">';
  html += dpItem('XP', (d.xp||0).toLocaleString()) + dpItem('Topics', d.topicsCompleted||0) + dpItem('Streak', (d.streak||0)+' days') + dpItem('Quizzes', (d.quizResults||[]).length);
  html += dpItem('Exams', (d.examResults||[]).length) + dpItem('Sessions', d.dailySessions||0);
  html += '</div>';

  if (soc){
    html += '<div class="dp-section">&#128100; Social</div><div class="dp-grid">';
    html += dpItem('Avatar', soc.avatar||'-') + dpItem('Bio', soc.bio||'-') + dpItem('Class Group', soc.class_group||'-');
    html += '</div>';
  }
  if (arena){
    html += '<div class="dp-section">&#127942; Arena</div><div class="dp-grid">';
    html += dpItem('XP', arena.xp||0) + dpItem('Wins', arena.wins||0) + dpItem('Losses', arena.losses||0);
    html += '</div>';
  }
  if (d.quizResults && d.quizResults.length){
    html += '<div class="dp-section">&#128203; Recent Quizzes</div><table class="mini-tbl"><thead><tr><th>Subject</th><th>Score</th><th>Date</th></tr></thead><tbody>';
    d.quizResults.slice(-8).reverse().forEach(q => {
      html += '<tr><td>' + esc(q.subject||q.topic||'-') + '</td><td style="font-weight:700">' + (q.score!=null?q.score+'%':q.correct+'/'+q.total) + '</td><td style="color:var(--dim)">' + (q.date?new Date(q.date).toLocaleDateString():'-') + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  if (d.topicsCompletedList && d.topicsCompletedList.length){
    html += '<div class="dp-section">&#128218; Recent Lessons</div><table class="mini-tbl"><thead><tr><th>Topic</th><th>XP</th><th>Date</th></tr></thead><tbody>';
    d.topicsCompletedList.slice(-8).reverse().forEach(t => {
      html += '<tr><td>' + esc(t.topic||t.key||'-') + '</td><td style="font-weight:700;color:var(--accent5)">' + (t.xp||0) + '</td><td style="color:var(--dim)">' + (t.date?new Date(t.date).toLocaleDateString():'-') + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';
  document.getElementById('detailPanel').innerHTML = html;
  document.getElementById('detailBd').classList.add('open');
};
window.closeDetail = function(){ document.getElementById('detailBd').classList.remove('open'); };

  c.innerHTML = html;
}

// ══════════════════ HELPERS ══════════════════
function esc(s){ var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function dpItem(k, v){ return '<div class="dp-item"><div class="dk">' + k + '</div><div class="dv">' + v + '</div></div>'; }
function timeAgo(ts){
  if (!ts) return '-';
  var t = typeof ts === 'number' ? ts : new Date(ts).getTime();
  var diff = Math.floor((Date.now() - t) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return new Date(t).toLocaleDateString();
}
window.filterTable = function(input, tableId){
  var val = input.value.toLowerCase();
  document.querySelectorAll('#'+tableId+' tbody tr').forEach(function(r){ r.style.display = r.textContent.toLowerCase().indexOf(val) > -1 ? '' : 'none'; });
};
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeDetail(); });
